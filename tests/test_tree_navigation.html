<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Navigation Test</title>
    <style>
        body {
            background: #020617;
            color: #f1f5f9;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #475569;
            border-radius: 10px;
        }
        select {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 8px 12px;
            color: #f1f5f9;
            min-width: 200px;
        }
        optgroup {
            font-weight: bold;
            color: #94a3b8;
        }
        option {
            color: #f1f5f9;
        }
    </style>
</head>
<body>
    <h1>Tree Navigation Test</h1>
    
    <div class="test-section">
        <h2>Instrument Selection (Tree Navigation)</h2>
        <p>This should show instruments organized in categories with emojis:</p>
        <select id="instrumentSelect"></select>
    </div>
    
    <div class="test-section">
        <h2>Preset Selection (Tree Navigation)</h2>
        <p>This should show presets organized in categories:</p>
        <select id="presetSelect"></select>
    </div>

    <script>
        // Default instruments (always available)
        const DEFAULT_INSTRUMENTS = [
            "Piano", "Guitar", "Bass", "Violin", "Flute", "Recorder", 
            "Trumpet", "Saxophone", "Koto", "Oud", "Ney", "Hammond Organ"
        ];

        // Extended instrument categories
        const INSTRUMENT_CATEGORIES = {
            "Pianos & Keys": [
                "Piano", "Electric Piano", "Grand Piano", "Upright Piano",
                "Rhodes Piano", "Wurlitzer", "Clavinet", "Harpsichord",
                "Celesta", "Glockenspiel", "Vibraphone", "Marimba", "Xylophone"
            ],
            "Guitars": [
                "Guitar", "Acoustic Guitar", "Electric Guitar", "Classical Guitar",
                "12-String Guitar", "Bass Guitar", "Electric Bass", "Acoustic Bass",
                "Ukulele", "Banjo", "Mandolin", "Oud", "Sitar", "Koto"
            ],
            "Strings": [
                "Violin", "Viola", "Cello", "Double Bass", "String Ensemble",
                "String Quartet", "Harp", "Erhu", "Guzheng"
            ],
            "Woodwinds": [
                "Flute", "Piccolo", "Clarinet", "Bass Clarinet", "Oboe",
                "English Horn", "Bassoon", "Contrabassoon", "Recorder", "Ney",
                "Shakuhachi", "Dizi"
            ],
            "Brass": [
                "Trumpet", "Cornet", "Flugelhorn", "Trombone", "Bass Trombone",
                "French Horn", "Tuba", "Euphonium", "Sousaphone"
            ],
            "Saxophones": [
                "Saxophone", "Soprano Sax", "Alto Sax", "Tenor Sax", "Baritone Sax"
            ],
            "Organs": [
                "Hammond Organ", "Pipe Organ", "Reed Organ", "Accordion", "Harmonica"
            ],
            "Percussion": [
                "Timpani", "Snare Drum", "Bass Drum", "Tom-Tom", "Cymbals",
                "Gong", "Triangle", "Tambourine", "Maracas", "Conga", "Bongo",
                "Tabla", "Djembe"
            ],
            "Synths & Electronic": [
                "Analog Synth", "Digital Synth", "FM Synth", "Pad Synth",
                "Lead Synth", "Bass Synth", "Arpeggiator", "Choir", "Voice"
            ],
            "World & Ethnic": [
                "Koto", "Oud", "Ney", "Sitar", "Erhu", "Guzheng", "Shakuhachi",
                "Dizi", "Kalimba", "Steel Drum", "Didgeridoo"
            ]
        };

        // Preset categories
        const CHANNEL_PRESET_CATEGORIES = {
            'Keys': {
                'Bright Keys': { type:'PolySynth', env:{ osc:'triangle', a:.003, d:.18, s:.45, r:.9, filter:{frequency:3500, Q:1.1} } },
                'Glass Piano': { type:'PolySynth', env:{ osc:'sine', a:.005, d:.2, s:.5, r:1.0, filter:{frequency:4200, Q:.9} } },
                'E-Piano Soft': { type:'PolySynth', env:{ osc:'triangle', a:.01, d:.3, s:.6, r:1.2, filter:{frequency:3000, Q:1.1}, tremolo:{rate:4.5, depth:.2} } },
                'Keys Mellow': { type:'PolySynth', env:{ osc:'triangle', a:.02, d:.25, s:.6, r:1.2, filter:{frequency:2600, Q:1.0} } },
                'Keys FM Bell': { type:'AMSynth', amOptions:{ modulationType:'sine' }, env:{ osc:'sine', a:.01, d:.2, s:.4, r:.9 } },
            },
            'Pads': {
                'Warm Pad': { type:'PolySynth', env:{ osc:'sawtooth', a:.2, d:.6, s:.85, r:1.8, filter:{frequency:1800, Q:.7}, vibrato:{rate:5, depth:.06} } },
                'Air Pad': { type:'PolySynth', env:{ osc:'sine', a:.25, d:.5, s:.9, r:2.4, filter:{frequency:2400, Q:.5}, chorus:{frequency:1.2, delayTime:2.5, depth:.6, wet:.3} } },
                'Noir Pad': { type:'PolySynth', env:{ osc:'sawtooth', a:.4, d:.7, s:.8, r:2.8, filter:{frequency:1400, Q:1.2}, vibrato:{rate:5.5, depth:.07} } },
                'Cloud Pad': { type:'PolySynth', env:{ osc:'sine', a:.35, d:.6, s:.9, r:2.8, filter:{frequency:2000,Q:.8} }, options:{ fx:{ reverb:{decay:3.2, wet:.4}, chorus:{frequency:0.8, delayTime:3.8, depth:.7, wet:.3} } } },
            },
            'Plucks': {
                'Soft Pluck': { type:'PluckSynth', options:{ pluckOptions:{ attackNoise:.25, dampening:2200, resonance:.8 } }, env:{ maxSustain:2 } },
                'Brittle Pluck': { type:'PluckSynth', options:{ pluckOptions:{ attackNoise:.6, dampening:1800, resonance:.9 } }, env:{ maxSustain:1.6 } },
                'Muted Pluck': { type:'PluckSynth', options:{ pluckOptions:{ attackNoise:.15, dampening:2500, resonance:.7 } }, env:{ maxSustain:1.2 } },
                'Harplike': { type:'PluckSynth', options:{ pluckOptions:{ attackNoise:.2, dampening:2600, resonance:.85 } }, env:{ maxSustain:2 } },
            },
            'Bass': {
                'Bass Sub': { type:'MonoSynth', env:{ osc:'sine', a:.01, d:.25, s:.6, r:.8, filter:{frequency:400, Q:1.5}, maxSustain:3 } },
                'Bass Punch': { type:'MonoSynth', env:{ osc:'square', a:.008, d:.18, s:.5, r:.6, filter:{frequency:600, Q:1.2}, maxSustain:2.5 } },
                'Bass Pluck': { type:'MonoSynth', env:{ osc:'triangle', a:.005, d:.2, s:.4, r:.5, filter:{frequency:800, Q:1.0}, maxSustain:1.4 } },
                'Bass Reese': { type:'DuoSynth', duoOptions:{ harmonicity:1.01 }, env:{ osc:'sawtooth', a:.01, d:.3, s:.6, r:.8, filter:{frequency:500,Q:1.2} } },
            },
            'Leads': {
                'Lead Silk': { type:'PolySynth', env:{ osc:'sawtooth', a:.02, d:.2, s:.6, r:.7, vibrato:{rate:6.5, depth:.05}, filter:{frequency:3800, Q:1.1} } },
                'Lead Bite': { type:'PolySynth', env:{ osc:'square', a:.005, d:.12, s:.45, r:.4, filter:{frequency:2800, Q:1.6} } },
                'Lead Glide': { type:'PolySynth', env:{ osc:'sawtooth', a:.015, d:.18, s:.55, r:.5, vibrato:{rate:7.2, depth:.04} } },
                'Lead Saw': { type:'PolySynth', env:{ osc:'sawtooth', a:.01, d:.12, s:.5, r:.4, filter:{frequency:3400,Q:1.2} } },
            },
            'Strings': {
                'Strings Smooth': { type:'PolySynth', env:{ osc:'sawtooth', a:.05, d:.3, s:.85, r:1.2, vibrato:{rate:6, depth:.05}, filter:{frequency:3600, Q:1.2} } },
                'Strings Octave': { type:'PolySynth', env:{ osc:'square', a:.03, d:.25, s:.8, r:1.1, filter:{frequency:3200, Q:1.0} } },
                'Strings Warm': { type:'PolySynth', env:{ osc:'triangle', a:.06, d:.35, s:.9, r:1.3, filter:{frequency:3000,Q:1.0} } },
            },
            'Organ': {
                'Organ Soft': { type:'PolySynth', env:{ osc:'square', a:.01, d:.25, s:.92, r:.6, tremolo:{rate:5, depth:.25}, filter:{frequency:4200, Q:.3} } },
                'Organ Hollow': { type:'PolySynth', env:{ osc:'triangle', a:.02, d:.2, s:.9, r:.7 } },
            },
            'Winds': {
                'Flute Airy': { type:'PolySynth', env:{ osc:'sine', a:.06, d:.15, s:.85, r:.4, vibrato:{rate:5, depth:.05}, filter:{frequency:4800, Q:.5} } },
                'Clarinet-ish': { type:'PolySynth', env:{ osc:'square', a:.03, d:.2, s:.8, r:.6, filter:{frequency:2500,Q:1.3} } },
            },
            'Experimental': {
                'PWM Dream': { type:'AMSynth', amOptions:{ modulationType:'square' }, env:{ osc:'sawtooth', a:.06, d:.3, s:.7, r:1.6 } },
                'Bit Grit': { type:'PolySynth', env:{ osc:'square', a:.003, d:.12, s:.4, r:.35, filter:{frequency:2000,Q:1.6} } },
                'Lo-Fi Tape': { type:'PolySynth', env:{ osc:'triangle', a:.02, d:.2, s:.7, r:.8, filter:{frequency:2200,Q:0.9}, tremolo:{rate:5.2, depth:.12} } },
            },
        };

        // Build organized instrument selector with categories
        function buildInstrumentSelector(selectElement) {
            selectElement.innerHTML = '';
            
            // Add default instruments first (always at the top)
            const defaultGroup = document.createElement('optgroup');
            defaultGroup.label = '🎵 Default Instruments';
            DEFAULT_INSTRUMENTS.forEach(instrument => {
                const option = document.createElement('option');
                option.value = instrument;
                option.textContent = instrument;
                defaultGroup.appendChild(option);
            });
            selectElement.appendChild(defaultGroup);
            
            // Add categorized instruments with emojis and better organization
            const categoryEmojis = {
                'Pianos & Keys': '🎹',
                'Guitars': '🎸',
                'Strings': '🎻',
                'Woodwinds': '🎷',
                'Brass': '🎺',
                'Saxophones': '🎷',
                'Organs': '🪗',
                'Percussion': '🥁',
                'Synths & Electronic': '🎛️',
                'World & Ethnic': '🌍'
            };
            
            Object.entries(INSTRUMENT_CATEGORIES).forEach(([category, instruments]) => {
                // Skip if this category only contains default instruments
                const nonDefaultInstruments = instruments.filter(instr => !DEFAULT_INSTRUMENTS.includes(instr));
                if (nonDefaultInstruments.length === 0) return;
                
                const group = document.createElement('optgroup');
                const emoji = categoryEmojis[category] || '🎵';
                group.label = `${emoji} ${category}`;
                
                // Sort instruments alphabetically within each category
                const sortedInstruments = [...instruments].sort();
                
                sortedInstruments.forEach(instrument => {
                    const option = document.createElement('option');
                    option.value = instrument;
                    option.textContent = instrument;
                    group.appendChild(option);
                });
                
                selectElement.appendChild(group);
            });
        }

        // Build preset selector with categories
        function buildPresetSelector(selectElement) {
            selectElement.innerHTML = '';
            
            // Add default option
            const defaultOption = document.createElement('option');
            defaultOption.value = 'Default';
            defaultOption.textContent = 'Default';
            selectElement.appendChild(defaultOption);
            
            // Add categorized presets
            Object.entries(CHANNEL_PRESET_CATEGORIES).forEach(([category, presets]) => {
                const group = document.createElement('optgroup');
                group.label = category;
                
                Object.keys(presets).forEach(presetName => {
                    const option = document.createElement('option');
                    option.value = presetName;
                    option.textContent = presetName;
                    group.appendChild(option);
                });
                
                selectElement.appendChild(group);
            });
        }

        // Initialize the selectors
        document.addEventListener('DOMContentLoaded', function() {
            const instrumentSelect = document.getElementById('instrumentSelect');
            const presetSelect = document.getElementById('presetSelect');
            
            buildInstrumentSelector(instrumentSelect);
            buildPresetSelector(presetSelect);
            
            // Set default values
            instrumentSelect.value = 'Piano';
            presetSelect.value = 'Default';
            
            console.log('Tree navigation test initialized');
            console.log('Instrument categories:', Object.keys(INSTRUMENT_CATEGORIES));
            console.log('Preset categories:', Object.keys(CHANNEL_PRESET_CATEGORIES));
        });
    </script>
</body>
</html>
